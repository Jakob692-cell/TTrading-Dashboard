<title>Challenge Ready — prop firm challenge simulator</title>
<meta name="description" content="Practise a prop firm challenge under the exact rules before you pay for one. Simulated trading on synthetic data.">
<meta name="color-scheme" content="dark">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Challenge Ready — visual identity

   The product's thesis is that the verdict is the product, not the chart. So the
   app is deliberately two places, and moving between them should feel like it:

     THE COCKPIT  — where you trade. An instrument panel: square corners, hairline
                    rules, etched labels, readouts. No cards, no rounding, no charm.
     THE REPORT   — where you are judged. Paper, serif, wide margins, rules instead
                    of boxes. A document that was issued to you.

   They share one type scale, one set of rules and one accent family, so it reads
   as one system with two grounds — a cockpit and its printed flight report.

   Type discipline, which is the identity: the serif never appears in the cockpit.
   The mono never carries prose. Every number is mono and tabular.

   Single-theme by intent, not omission. A trading instrument is dark and a printed
   assessment is paper; inverting either would break the metaphor the product runs on.

   Colour note: P&L is oxblood/ultramarine rather than red/green. ~8% of men have
   red-green colour deficiency and this audience skews ~69% male, so the most
   safety-critical number on screen must not depend on that distinction. Every
   value also carries an explicit sign, so colour is never the only channel.
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  /* grounds */
  --ink:        #14171C;   /* cockpit ground — cool graphite, not pure black */
  --panel:      #1A1E25;   /* instrument face */
  --panel-hi:   #212630;   /* raised instrument */
  --rule:       #2B313B;   /* hairline */
  --rule-soft:  #21262E;

  --paper:      #E8EBEF;   /* report ground — cool bluish white, not warm cream */
  --paper-2:    #DDE1E7;
  --paper-rule: #C3C9D2;

  /* ink */
  --readout:    #CFD6DE;   /* primary readout on the panel */
  --readout-2:  #8D97A4;   /* secondary */
  --readout-3:  #616B78;   /* etched label */
  --ink-1:      #15181D;   /* primary on paper */
  --ink-2:      #4A525E;
  --ink-3:      #78818E;

  /* signal — semantic, not decorative */
  --oxblood:    #A6273A;   /* breach, failure, loss */
  --oxblood-lo: #D45C6E;   /* the same signal, legible on the dark ground */
  --ultra:      #3B57D8;   /* pass, armed, position */
  --ultra-lo:   #7D93FF;
  --caution:    #B87A12;
  --caution-lo: #E0A33C;

  /* type */
  --serif: Georgia, 'Iowan Old Style', 'Times New Roman', Times, serif;
  --sans:  system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono:  ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;

  /* scale */
  --t-xs: 11px; --t-sm: 12.5px; --t-md: 14px; --t-lg: 17px;
  --t-xl: 22px; --t-2xl: 30px; --t-3xl: 42px; --t-4xl: 58px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--ink);
  color: var(--readout);
  font-family: var(--sans);
  font-size: var(--t-md);
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
button:disabled { cursor: not-allowed; opacity: .35; }
input, select { font: inherit; color: inherit; }

:focus-visible { outline: 2px solid var(--ultra-lo); outline-offset: 2px; }

.num, .n { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Etched label — the single most repeated device in the cockpit. */
.lbl {
  font-family: var(--sans);
  font-size: var(--t-xs);
  font-weight: 600;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--readout-3);
}

#app { min-height: 100%; display: flex; flex-direction: column; }

/* ── masthead ──────────────────────────────────────────────────────────────
   A fixed instrument bezel. Square, hairline-ruled, no rounding anywhere. */
.topbar {
  display: flex; align-items: center; gap: 20px;
  padding: 0 20px; height: 46px;
  background: var(--panel);
  border-bottom: 1px solid var(--rule);
  flex-shrink: 0;
}
.logo {
  font-family: var(--sans);
  font-size: var(--t-sm); font-weight: 700;
  letter-spacing: .18em; text-transform: uppercase;
  color: var(--readout);
}
.logo span { color: var(--readout-3); }

.sim-badge {
  font-family: var(--mono);
  font-size: 10px; font-weight: 700; letter-spacing: .16em;
  padding: 3px 7px;
  color: var(--caution-lo);
  border: 1px solid color-mix(in srgb, var(--caution) 55%, transparent);
}
.topbar .spacer { flex: 1; }

.topbar nav { display: flex; align-self: stretch; }
.topbar nav button {
  padding: 0 15px; align-self: stretch;
  font-size: var(--t-sm); font-weight: 600;
  letter-spacing: .09em; text-transform: uppercase;
  color: var(--readout-3);
  border-bottom: 2px solid transparent;
}
.topbar nav button:hover { color: var(--readout); }
.topbar nav button.on { color: var(--readout); border-bottom-color: var(--ultra-lo); }

.lvl { display: flex; align-items: baseline; gap: 9px; font-size: var(--t-xs); color: var(--readout-3); }
.lvl b { font-family: var(--mono); font-size: var(--t-sm); color: var(--readout); font-weight: 600; }
.lvl .lname { letter-spacing: .1em; text-transform: uppercase; }
.lvl .bar { width: 46px; height: 2px; background: var(--rule); align-self: center; }
.lvl .bar i { display: block; height: 100%; background: var(--ultra-lo); }

main { flex: 1; display: flex; flex-direction: column; min-height: 0; }

/* ═══ THE REPORT — paper ground ════════════════════════════════════════════ */
.paper {
  background: var(--paper);
  color: var(--ink-1);
  flex: 1;
  /* A printed sheet has an edge. This is the seam between the two worlds. */
  border-top: 3px solid var(--ink);
}
.sheet { max-width: 1080px; margin: 0 auto; padding: 40px 32px 72px; }
.sheet.narrow { max-width: 740px; }

.paper h1, .paper h2, .paper .serif { font-family: var(--serif); font-weight: 400; }
.paper h1 { font-size: var(--t-3xl); line-height: 1.08; letter-spacing: -.015em; text-wrap: balance; }
.paper h2 { font-size: var(--t-xl); line-height: 1.2; letter-spacing: -.01em; }
.paper p  { color: var(--ink-2); line-height: 1.62; max-width: 68ch; }
.paper .lbl { color: var(--ink-3); }
.paper a { color: var(--ultra); }

/* Section head: a ruled band, the way a form segments a page. */
.band {
  display: flex; align-items: baseline; gap: 12px;
  border-bottom: 1px solid var(--ink-1);
  padding-bottom: 6px; margin-bottom: 18px;
}
.band .lbl { color: var(--ink-1); }
.band .rest { flex: 1; text-align: right; font-family: var(--mono); font-size: var(--t-xs); color: var(--ink-3); }

/* Panels on paper are rules, not boxes. */
.block { border-top: 1px solid var(--paper-rule); padding-top: 16px; }

.cols { display: grid; gap: 34px; }
.c2 { grid-template-columns: 1fr 1fr; }
.c3 { grid-template-columns: repeat(3, 1fr); }
.c-wide { grid-template-columns: 1.35fr 1fr; }
@media (max-width: 880px) { .c2, .c3, .c-wide { grid-template-columns: 1fr; } }

/* ── setup masthead: asymmetric, left-aligned, filing-header logic ───────── */
.masthead { display: grid; grid-template-columns: 1.15fr 1fr; gap: 56px; align-items: end; margin-bottom: 52px; }
@media (max-width: 880px) { .masthead { grid-template-columns: 1fr; gap: 30px; } }
.masthead h1 { font-size: 45px; line-height: 1.1; }
@media (max-width: 1000px) { .masthead h1 { font-size: 38px; } }
.masthead .kicker { margin-bottom: 15px; }
.masthead p { margin-top: 16px; font-size: 15.5px; }

/* Sourced statistics as a ruled table, not floating numbers. */
.figures { width: 100%; border-collapse: collapse; }
.figures caption {
  text-align: left; padding-bottom: 7px;
  border-bottom: 1px solid var(--ink-1);
  font-family: var(--sans); font-size: var(--t-xs); font-weight: 600;
  letter-spacing: .13em; text-transform: uppercase; color: var(--ink-1);
}
.figures td { padding: 7px 0; border-bottom: 1px solid var(--paper-rule); vertical-align: baseline; }
.figures td:first-child {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: var(--t-lg); font-weight: 600; width: 4.6em; color: var(--ink-1);
}
.figures td:last-child { font-size: var(--t-sm); color: var(--ink-2); line-height: 1.35; }
.figures tr.low td:first-child { color: var(--oxblood); }
.src { font-size: var(--t-xs); color: var(--ink-3); line-height: 1.55; margin-top: 9px; }
.src a { color: var(--ink-3); }

/* ── rule-set picker: a specification sheet, one row per programme ───────── */
.firm-grid { display: flex; flex-direction: column; border-top: 1px solid var(--ink-1); }
.firm {
  display: grid; grid-template-columns: 1.1fr 1fr auto;
  gap: 20px; align-items: baseline;
  padding: 13px 14px 13px 0;
  text-align: left;
  border-bottom: 1px solid var(--paper-rule);
  position: relative;
  transition: background .12s;
}
.firm::before {
  content: ''; position: absolute; left: -14px; top: 0; bottom: 0;
  width: 3px; background: transparent;
}
.firm:hover { background: var(--paper-2); }
.firm.on { background: var(--paper-2); }
.firm.on::before { background: var(--ultra); }
.firm b { font-family: var(--serif); font-size: var(--t-lg); font-weight: 400; color: var(--ink-1); }
.firm .prog { font-size: var(--t-sm); color: var(--ink-2); }
.firm .dd {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: var(--t-xs); color: var(--ink-3); text-align: right; white-space: nowrap;
}
.firm .dd em { font-style: normal; color: var(--ink-2); }

/* ── rule specification table ────────────────────────────────────────────── */
.rules-table { width: 100%; border-collapse: collapse; }
.rules-table td { padding: 9px 0; border-bottom: 1px solid var(--paper-rule); vertical-align: baseline; }
.rules-table td:first-child { color: var(--ink-2); font-size: var(--t-sm); white-space: nowrap; padding-right: 16px; }
.rules-table td:last-child {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: var(--t-sm); text-align: right; color: var(--ink-1); line-height: 1.45;
}
.rules-table tr:last-child td { border-bottom: none; }

/* A margin note, the way an examiner annotates. */
.note {
  font-size: var(--t-sm); color: var(--ink-2); line-height: 1.55;
  padding-left: 13px; border-left: 2px solid var(--ink-1);
  margin-bottom: 11px;
}
.paper .note em { font-style: italic; color: var(--ink-1); }

/* ── form controls on paper ──────────────────────────────────────────────── */
.field { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--paper-rule); }
.field label { font-size: var(--t-sm); color: var(--ink-1); }
.field small { display: block; color: var(--ink-3); font-size: var(--t-xs); margin-top: 3px; }
.field input, .field select {
  background: transparent; border: none; border-bottom: 1px solid var(--ink-2);
  padding: 3px 2px; width: 96px; text-align: right;
  font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: var(--t-sm);
  color: var(--ink-1); border-radius: 0;
}
.field input:focus, .field select:focus { outline: none; border-bottom-color: var(--ultra); }
.field .pair { display: flex; gap: 8px; }
.field .pair input { width: 46px; }

/* ── buttons ─────────────────────────────────────────────────────────────── */
.btn {
  font-family: var(--sans); font-size: var(--t-sm); font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 11px 18px; border: 1px solid currentColor; background: transparent;
  transition: background .12s, color .12s;
}
.paper .btn { color: var(--ink-1); }
.paper .btn:hover:not(:disabled) { background: var(--ink-1); color: var(--paper); }
.btn.primary { background: var(--ink-1); color: var(--paper); border-color: var(--ink-1); }
.paper .btn.primary:hover:not(:disabled) { background: var(--ultra); border-color: var(--ultra); color: #fff; }
.btn.big { padding: 15px 30px; font-size: var(--t-md); }
.btn.sm { padding: 7px 11px; font-size: var(--t-xs); letter-spacing: .08em; }
.btn.quiet { border-color: var(--paper-rule); color: var(--ink-2); }
.paper .btn.danger { color: var(--oxblood); border-color: color-mix(in srgb, var(--oxblood) 45%, transparent); }
.paper .btn.danger:hover { background: var(--oxblood); color: var(--paper); }

.actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 30px; }
.actions .caption { font-size: var(--t-xs); color: var(--ink-3); max-width: 40ch; line-height: 1.5; }

/* ═══ THE COCKPIT — instrument ground ══════════════════════════════════════ */
.trade-shell { display: flex; flex-direction: column; height: calc(100vh - 46px); background: var(--ink); }

/* HUD: a segmented instrument strip. Etched label, big readout, a travel meter. */
.hud { display: flex; background: var(--panel); border-bottom: 1px solid var(--rule); flex-shrink: 0; }
.hud .cell {
  flex: 1; min-width: 0; padding: 9px 14px 10px;
  border-right: 1px solid var(--rule-soft);
  position: relative;
}
.hud .cell:last-child { border-right: none; }
.hud .cell .k { font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--readout-3); }
.hud .cell .v {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: 19px; font-weight: 500; letter-spacing: -.01em;
  margin-top: 3px; color: var(--readout);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hud .cell .meter { height: 2px; background: var(--rule); margin-top: 7px; }
.hud .cell .meter i { display: block; height: 100%; background: var(--readout-2); transition: width .18s, background .18s; }
.hud .cell small { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--readout-3); margin-top: 5px; }

/* Alarm states are structural: the whole instrument changes, not just a number. */
.hud .cell.caution { background: color-mix(in srgb, var(--caution) 9%, var(--panel)); }
.hud .cell.caution .v, .hud .cell.caution .k { color: var(--caution-lo); }
.hud .cell.caution .meter i { background: var(--caution-lo); }
.hud .cell.alarm { background: color-mix(in srgb, var(--oxblood) 16%, var(--panel)); }
.hud .cell.alarm .v, .hud .cell.alarm .k { color: var(--oxblood-lo); }
.hud .cell.alarm .meter i { background: var(--oxblood-lo); }
.hud .cell.alarm::after {
  content: ''; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--oxblood-lo);
}
.hud .cell.armed .v { color: var(--ultra-lo); }
.hud .cell.armed .meter i { background: var(--ultra-lo); }

.chart-area { flex: 1; position: relative; min-height: 0; background: var(--ink); }
.chart-area canvas { display: block; width: 100%; height: 100%; }
.chart-overlay, .ticker {
  position: absolute; top: 11px;
  font-family: var(--mono); font-size: 11px; line-height: 1.65;
  color: var(--readout-3); pointer-events: none;
}
.chart-overlay { left: 13px; }
 /* Offset by the price axis gutter so the last price never collides with an axis label. */
.ticker { right: 78px; text-align: right; }
.ticker b { display: block; font-size: 15px; font-weight: 500; color: var(--readout); }

/* Position strip: the state line between chart and controls. */
.pos-strip {
  display: flex; align-items: center; gap: 18px;
  padding: 8px 14px; min-height: 33px;
  background: var(--panel);
  border-top: 1px solid var(--rule);
  font-family: var(--mono); font-size: var(--t-sm);
  flex-shrink: 0; flex-wrap: wrap;
}
.pos-strip .flat { color: var(--readout-3); letter-spacing: .1em; text-transform: uppercase; font-size: var(--t-xs); }
.pos-strip .side { color: var(--ultra-lo); font-weight: 600; }
.pos-strip .prot { color: var(--readout-3); }
.pos-strip .caution { color: var(--caution-lo); }
.pos-strip .alarm { color: var(--oxblood-lo); }

/* Control deck. */
.order-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--panel-hi);
  border-top: 1px solid var(--rule); flex-wrap: wrap; flex-shrink: 0;
}
.order-bar .grp { display: flex; align-items: center; gap: 7px; }
.order-bar label { font-size: 10px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; color: var(--readout-3); }
.order-bar input {
  background: var(--ink); border: 1px solid var(--rule); border-radius: 0;
  padding: 6px 8px; width: 62px; text-align: right;
  font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: var(--t-sm);
  color: var(--readout);
}
.order-bar input:focus { outline: none; border-color: var(--ultra-lo); }
.order-bar .sep { width: 1px; height: 24px; background: var(--rule); }
.order-bar .spacer { flex: 1; }

.ctl {
  font-family: var(--sans); font-size: var(--t-xs); font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase;
  padding: 9px 15px; border: 1px solid var(--rule); color: var(--readout-2);
  transition: .12s;
}
.ctl:hover:not(:disabled) { border-color: var(--readout-3); color: var(--readout); }
.ctl.buy  { color: var(--ultra-lo);   border-color: color-mix(in srgb, var(--ultra) 60%, transparent); }
.ctl.buy:hover  { background: var(--ultra); color: #fff; border-color: var(--ultra); }
.ctl.sell { color: var(--caution-lo); border-color: color-mix(in srgb, var(--caution) 55%, transparent); }
.ctl.sell:hover { background: var(--caution); color: var(--ink); border-color: var(--caution); }
.ctl.end  { color: var(--oxblood-lo); border-color: color-mix(in srgb, var(--oxblood) 50%, transparent); }
.ctl.end:hover  { background: var(--oxblood); color: #fff; border-color: var(--oxblood); }

.seg { display: flex; }
.seg button {
  font-family: var(--mono); font-size: var(--t-xs);
  padding: 7px 10px; color: var(--readout-3);
  border: 1px solid var(--rule); border-right-width: 0;
}
.seg button:last-child { border-right-width: 1px; }
.seg button:hover { color: var(--readout); }
.seg button.on { color: var(--ink); background: var(--readout-2); border-color: var(--readout-2); }

/* Toast: an annunciator, not a notification bubble. */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 104px; z-index: 60;
  padding: 11px 17px; max-width: 480px;
  background: var(--panel-hi); border: 1px solid var(--rule);
  border-left: 3px solid var(--readout-2);
  font-family: var(--mono); font-size: var(--t-sm); line-height: 1.45;
  color: var(--readout);
  box-shadow: 0 14px 40px rgba(0, 0, 0, .55);
}
.toast.block { border-left-color: var(--caution-lo); color: var(--caution-lo); }
.toast.guard { border-left-color: var(--ultra-lo);   color: var(--ultra-lo); }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .16s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 6px); } }
}

/* ═══ VERDICT — the report's opening statement ═════════════════════════════ */
.verdict { padding: 6px 0 30px; border-bottom: 1px solid var(--ink-1); margin-bottom: 30px; }
.verdict .tag {
  display: inline-flex; align-items: center; gap: 9px;
  font-family: var(--mono); font-size: var(--t-xs); font-weight: 700;
  letter-spacing: .16em; margin-bottom: 18px;
}
.verdict .tag::before { content: ''; width: 26px; height: 2px; background: currentColor; }
.verdict.fail  .tag { color: var(--oxblood); }
.verdict.pass  .tag { color: var(--ultra); }
.verdict.ended .tag { color: var(--caution); }
.verdict h1 { font-size: var(--t-4xl); max-width: 20ch; }
.verdict .meta {
  margin-top: 16px; font-family: var(--mono); font-size: var(--t-sm);
  color: var(--ink-2); display: flex; gap: 22px; flex-wrap: wrap;
}
.verdict .meta b { color: var(--ink-1); font-weight: 600; }

/* Primary finding — the one thing to take away. */
.primary { border-left: 3px solid var(--oxblood); padding: 2px 0 2px 18px; margin-bottom: 32px; }
.primary .code { font-family: var(--mono); font-size: var(--t-xs); letter-spacing: .13em; color: var(--ink-3); }
.primary h2 { margin: 5px 0 8px; font-size: var(--t-2xl); }
.primary .stat { font-family: var(--mono); font-size: var(--t-sm); color: var(--oxblood); margin-bottom: 10px; }

/* Timeline: an event log, set as a ledger. */
.timeline { font-family: var(--mono); font-size: var(--t-sm); }
.timeline .row { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--paper-rule); }
.timeline .row:last-child { border-bottom: none; }
.timeline .t { color: var(--ink-3); }
.timeline .x { color: var(--ink-2); }
.timeline .row.loss .x   { color: var(--oxblood); }
.timeline .row.win .x    { color: var(--ultra); }
.timeline .row.entry .x  { color: var(--ink-1); }
.timeline .row.blocked .x, .timeline .row.floor .x { color: var(--caution); }
.timeline .row.guard .x  { color: var(--ultra); }
.timeline .row.pass .x   { color: var(--ultra); font-weight: 600; }
.timeline .daybreak {
  display: flex; align-items: center; gap: 10px;
  margin: 14px 0 6px;
  font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3);
}
.timeline .daybreak::after { content: ''; flex: 1; height: 1px; background: var(--paper-rule); }
.timeline .row.breach { background: color-mix(in srgb, var(--oxblood) 9%, transparent); margin: 0 -10px; padding: 8px 10px; }
.timeline .row.breach .x { color: var(--oxblood); font-weight: 600; }

/* Findings list. */

 * panel, everything else is a printed report on paper. View functions that render into
 * `.paper > .sheet` belong to the report world; `viewTrade` is the only cockpit view.
 *
 * Deliberately a plain module with a small hand-rolled view layer: no framework, no build
 * step, no runtime dependencies. The engine is the asset; the UI should stay cheap to redo.
 */









// ── persistence ─────────────────────────────────────────────────────────────
const KEY = 'challenge-ready/v1';

function loadProfile() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch { /* corrupt or unavailable storage must never break the app */ }
  return { runs: [], xp: 0, streak: 0, lastDay: null, completedDrills: [] };
}

function saveProfile(p) {
  try { localStorage.setItem(KEY, JSON.stringify(p)); } catch { /* private mode */ }
}

/** Runs are stored slimmed down — the full timeline of a long run is large. */
function slimRun(a) {
  return {
    status: a.status, breach: a.breach, balance: a.balance, floor: a.floor,
    peakEquity: a.peakEquity, trades: a.trades, dayPnL: a.dayPnL,
    tradingDays: a.tradingDays, timeline: a.timeline.slice(-400),
    rs: a.rs, finishedAt: Date.now(),
  };
}

const $ = (sel, el = document) => el.querySelector(sel);
const money = (n, sign = false) =>
  (sign && n > 0 ? '+' : n < 0 ? '−' : '') + '$' + Math.abs(Math.round(n)).toLocaleString('en-US');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function go(view) { S.view = view; stop(); render(); window.scrollTo(0, 0); }

function toast(msg, kind = '') {
  S.toast = { msg, kind };
  clearTimeout(S.toastTimer);
  S.toastTimer = setTimeout(() => { S.toast = null; paintToast(); }, 4200);
  paintToast();
}

function paintToast() {
  let el = $('#toast');
  if (!S.toast) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.className = `toast ${S.toast.kind}`;
  el.textContent = S.toast.msg;
}

function readGuards(main) {
  return normalizeGuards({
    maxTradesPerDay: $('#g-cap', main)?.value,
    cooldownAfterLosses: $('#g-cool', main)?.value,
    cooldownMinutes: 15,
    sessionStartHour: $('#g-s', main)?.value,
    sessionEndHour: $('#g-e', main)?.value,
  });
}

function startRun() {
  const main = $('#main');
  S.guards = readGuards(main);
  if (S.drill?.guards) S.guards = normalizeGuards({ ...S.guards, ...S.drill.guards });

  const rs = loadRuleSet(S.rulesetId);
  // Seed from the ruleset + attempt number: a fresh but reproducible market each run.
  const seed = `${S.rulesetId}|${S.symbol}|${S.profile.runs.length}`;
  S.session = loadSession({
    symbol: S.symbol,
    days: rs.maxTradingDays ? Math.min(rs.maxTradingDays, 14) : 10,
    seed,
    barsPerDay: 300,
  });
  S.account = createAccount(rs, S.session.instrument, S.guards);
  // Warm up so the chart is populated on the first frame — an empty chart on the most
  // important screen reads as a broken product.
  S.cursor = 260;
  for (let i = 0; i < S.cursor; i++) S.account = applyBar(S.account, S.session.bars[i]);
  S.playing = false;
  go('trade');
  play();
}

// ═══ TRADE — cockpit ground ═════════════════════════════════════════════════
let chart = null;

function viewTrade(main) {
  main.innerHTML = `
    <div class="trade-shell">
      <div class="hud" id="hud"></div>
      <div class="chart-area">
        <canvas id="cv"></canvas>
        <div class="chart-overlay" id="ov"></div>
        <div class="ticker" id="tk"></div>
      </div>
      <div class="pos-strip" id="ps"></div>
      <div class="order-bar">
        <div class="grp"><label for="o-size">Size</label>
          <input id="o-size" type="number" min="1" value="${S.orderSize}" ${S.drill?.lockSize ? 'disabled' : ''}></div>
        <div class="grp"><label for="o-stop">Stop</label><input id="o-stop" type="number" min="0" value="${S.stopPts}"></div>
        <div class="grp"><label for="o-tgt">Target</label><input id="o-tgt" type="number" min="0" value="${S.targetPts}"></div>
        <div class="sep"></div>
        <button class="ctl buy"  id="b-buy">Buy</button>
        <button class="ctl sell" id="b-sell">Sell</button>
        <button class="ctl"      id="b-flat">Flatten</button>
        <div class="sep"></div>
        <div class="seg">${[1, 4, 8, 25, 100].map((s) => `<button data-sp="${s}" class="${S.speed === s ? 'on' : ''}">${s}×</button>`).join('')}</div>
        <button class="ctl" id="b-play">${S.playing ? 'Pause' : 'Play'}</button>
        <div class="sep"></div>
        <div class="seg">${[1, 5, 15].map((t) => `<button data-tf="${t}" class="${S.tf === t ? 'on' : ''}">${t}m</button>`).join('')}</div>
        <div class="spacer"></div>
        <button class="ctl end" id="b-end">End run</button>
      </div>
    </div>`;

  chart = new Chart($('#cv', main));

  $('#b-buy', main).addEventListener('click', () => order('long'));
  $('#b-sell', main).addEventListener('click', () => order('short'));
  $('#b-flat', main).addEventListener('click', flatten);
  $('#b-play', main).addEventListener('click', () => (S.playing ? stop(true) : play()));
  $('#b-end', main).addEventListener('click', () => finish());
  main.querySelectorAll('[data-sp]').forEach((b) => b.addEventListener('click', () => {
    S.speed = +b.dataset.sp;
    main.querySelectorAll('[data-sp]').forEach((x) => x.classList.toggle('on', x === b));
    if (S.playing) { stop(); play(); }
  }));
  main.querySelectorAll('[data-tf]').forEach((b) => b.addEventListener('click', () => {
    S.tf = +b.dataset.tf;
    main.querySelectorAll('[data-tf]').forEach((x) => x.classList.toggle('on', x === b));
    paintTrade();
  }));
  ['o-size', 'o-stop', 'o-tgt'].forEach((id) => $('#' + id, main).addEventListener('change', (e) => {
    const v = Math.max(0, +e.target.value || 0);
    if (id === 'o-size') S.orderSize = Math.max(1, v); else if (id === 'o-stop') S.stopPts = v; else S.targetPts = v;
  }));

  document.onkeydown = (e) => {
    if (S.view !== 'trade' || e.target.tagName === 'INPUT') return;
    if (e.key === 'b') order('long');
    if (e.key === 's') order('short');
    if (e.key === 'f') flatten();
    if (e.key === ' ') { e.preventDefault(); S.playing ? stop(true) : play(); }
  };

  paintTrade();
}

function play() {
  if (S.playing) return;
  S.playing = true;
  const tick = () => {
    if (!S.playing) return;
    step();
    if (S.playing) S.timer = setTimeout(tick, Math.max(12, 420 / S.speed));
  };
  S.timer = setTimeout(tick, 200);
  const b = $('#b-play'); if (b) b.textContent = 'Pause';
}

function stop(repaint = false) {
  S.playing = false;
  clearTimeout(S.timer);
  const b = $('#b-play'); if (b) b.textContent = 'Play';
  if (repaint) paintTrade();
}

function step() {
  if (S.cursor >= S.session.bars.length - 1) { finish(); return; }
  S.account = applyBar(S.account, S.session.bars[S.cursor]);
  S.cursor++;
  if (S.account.status !== 'active') { finish(); return; }
  paintTrade();
}

function order(side) {
  if (!S.account || S.account.status !== 'active') return;
  const bar = S.session.bars[S.cursor - 1];
  const size = S.drill?.lockSize ? 1 : S.orderSize;
  const o = { type: 'market', side, size };
  if (S.stopPts > 0)   o.stop   = side === 'long' ? bar.c - S.stopPts : bar.c + S.stopPts;
  if (S.targetPts > 0) o.target = side === 'long' ? bar.c + S.targetPts : bar.c - S.targetPts;

  const r = submitOrder(S.account, o, bar, {
    inNewsWindow: inNewsWindow(S.session, bar.t, S.account.rs.newsWindowMin),
  });
  S.account = r.state;
  if (r.rejected) {
    toast(r.message || 'Order rejected', String(r.rejected).startsWith('GUARD') ? 'guard' : 'block');
  }
  paintTrade();
}

function flatten() {
  if (!S.account?.position) return;
  const bar = S.session.bars[S.cursor - 1];
  S.account = closePosition(S.account, bar.c).state;
  if (S.account.status !== 'active') { finish(); return; }
  paintTrade();
}

function paintTrade() {
  if (S.view !== 'trade' || !S.account) return;
  const a = S.account;
  const h = hud(a);
  const bar = S.session.bars[S.cursor - 1];

  // Instrument order is fixed. It never scrolls, collapses or reorders.
  $('#hud').innerHTML = [
    cell('Equity', money(h.equity), null, `Balance ${money(h.balance)}`),
    cell('Daily limit', h.dailyRoom === null ? '—' : money(h.dailyRoom),
         h.dailyPct, h.dailyFloor === null ? 'No daily rule' : `Floor ${money(h.dailyFloor)}`),
    cell('Loss floor', money(h.floorRoom), h.floorPct,
         `${money(h.floor)}${h.floorLocked ? ' · locked' : ddArrow(a.rs.maxLossType)}`),
    cell('Target', money(h.profit), null, `of ${money(h.target)} · ${Math.round(h.targetPct * 100)}%`,
         h.targetPct > 0 ? 'armed' : '', h.targetPct),
    cell('Day', `${h.day}${h.maxDays ? '/' + h.maxDays : ''}`, null,
         `${h.tradingDays} of ${h.minTradingDays} min days`),
    cell('Trades today', `${h.tradesToday}${h.tradeCap !== null ? '/' + h.tradeCap : ''}`, null,
         h.consistencyPct !== null ? `Best day ${Math.round(h.consistencyPct * 100)}%` : 'No consistency rule'),
  ].join('');

  const visible = 190;
  const from = Math.max(0, S.cursor - visible * S.tf);
  const bars = resample(S.session.bars.slice(from, S.cursor), S.tf);

  const levels = [];
  if (a.position) {
    const pv = a.instrument.pointValue;
    const fp = equityToPrice(a.position, bar.c, pv, a.balance, a.floor);
    if (fp !== null && Number.isFinite(fp)) levels.push({ price: fp, color: '#D45C6E', label: 'FLOOR', bold: true, inRangeOnly: true });
    if (a.dailyFloor !== null) {
      const dp = equityToPrice(a.position, bar.c, pv, a.balance, a.dailyFloor);
      if (dp !== null && Number.isFinite(dp)) levels.push({ price: dp, color: '#E0A33C', label: 'DAILY', dashed: true, inRangeOnly: true });
    }
  }
  chart.set({
    bars, position: a.position, levels, trades: a.trades.slice(-24),
    news: S.session.news, digits: a.instrument.digits, tf: S.tf,
  });

  const upl = a.position
    ? (bar.c - a.position.entryPrice) * (a.position.side === 'long' ? 1 : -1) * a.position.size * a.instrument.pointValue
    : 0;

  $('#ov').innerHTML = `${esc(a.instrument.name)} · ${S.tf}m<br>synthetic · seed ${esc(S.session.seed)}`;
  $('#tk').innerHTML = `<b>${bar.c.toFixed(a.instrument.digits)}</b>${new Date(bar.t).toISOString().slice(0, 16).replace('T', ' ')}Z`;

  const warn = h.warnings.filter((w) => w.code !== 'CONSISTENCY_BLOCK');
  const cd = h.cooldownUntil && bar.t < h.cooldownUntil
    ? `<span class="caution">Cooldown ${Math.ceil((h.cooldownUntil - bar.t) / 60000)}m</span>` : '';
  $('#ps').innerHTML = (a.position
    ? `<span class="side">${a.position.side.toUpperCase()} ${a.position.size} @ ${a.position.entryPrice.toFixed(a.instrument.digits)}</span>
       <span class="${upl >= 0 ? 'pos' : 'neg'}">${money(upl, true)} open</span>
       ${a.position.stop ? `<span class="prot">SL ${a.position.stop.toFixed(a.instrument.digits)}</span>` : ''}
       ${a.position.target ? `<span class="prot">TP ${a.position.target.toFixed(a.instrument.digits)}</span>` : ''}`
    : `<span class="flat">Flat</span>`)
    + cd
    + warn.map((w) => `<span class="${w.sev === 2 ? 'alarm' : 'caution'}">${esc(w.msg)}</span>`).join('');
}

/** One instrument in the HUD strip. `state` forces a class; otherwise proximity decides. */
function cell(k, v, pct, sub, state = '', meterPct = null) {
  let cls = state;
  if (!cls && pct !== null && pct !== undefined) {
    cls = pct <= 0.15 ? 'alarm' : pct <= 0.3 ? 'caution' : '';
  }
  const width = meterPct ?? pct;
  return `<div class="cell ${cls}">
    <div class="k">${esc(k)}</div>
    <div class="v">${esc(v)}</div>
    ${width === null || width === undefined ? ''
      : `<div class="meter"><i style="width:${Math.round(width * 100)}%"></i></div>`}
    <small>${esc(sub || '')}</small>
  </div>`;
}

const ddArrow = (t) => (t === 'static' ? ' · fixed' : ' · trailing');
const ddLabel = (t) => ({
  static: 'Static', trailing_intraday: 'Intraday trail',
  trailing_eod: 'EOD trail', trailing_to_static: 'Trail → lock',
}[t]);

// ── finish ──────────────────────────────────────────────────────────────────
function finish() {
  stop();
  // A run that neither passed nor breached still terminates — record it as 'ended' rather
  // than leaving it 'active', or it will never be scored and the record has nothing to show.
  if (S.account.status === 'active') S.account = { ...S.account, status: 'ended' };
  const a = S.account;
  const { findings, primary, metrics } = classify(a);
  const { xp, notes } = xpForRun(a, findings);

  const profile = { ...S.profile };
  profile.runs = [...profile.runs, slimRun(a)].slice(-40);
  profile.xp += xp;
  const today = new Date().toISOString().slice(0, 10);
  if (profile.lastDay !== today) {
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    profile.streak = profile.lastDay === yesterday ? profile.streak + 1 : 1;
    profile.lastDay = today;
  }
  S.profile = profile;
  saveProfile(profile);

  S.lastResult = { findings, primary, metrics, xp, notes, drills: drillsFor(findings) };
  go('autopsy');
}

// ═══ AUTOPSY — report ground ════════════════════════════════════════════════

  main.innerHTML = `<div class="paper"><div class="sheet">

    <div class="verdict ${kind}">

          : breached ? esc(a.breach.detail)
          : 'You stopped before a verdict'}</h1>
      <div class="meta">
        <span>${esc(a.rs.firm)} · ${esc(a.rs.label)}</span>
        <span>Result <b class="${profit >= 0 ? 'pos' : 'neg'}">${money(profit, true)}</b></span>
        <span>Trades <b>${a.trades.length}</b></span>
        <span>Days <b>${a.tradingDays.length}</b></span>
      </div>
    </div>

    ${primary && !passed ? `
    <div class="primary">
      <div class="code">Primary pattern · ${esc(primary.code)}</div>
      <h2>${esc(primary.name)}</h2>
      <div class="stat">${esc(primary.stat)}</div>
      <p>${esc(primary.detail)}</p>
    </div>` : ''}

    <div class="cols c-wide">
      <div>
        <div class="band"><span class="lbl">What actually happened</span><span class="rest">last ${events.length} events</span></div>
        <div class="timeline">
          ${events.map((e, i) => {
            // Break the log by session, or the clock appears to run backwards at a day roll.
            const newDay = e.day && e.day !== events[i - 1]?.day;
            return `${newDay ? `<div class="daybreak"><span>${esc(dayLabel(e.day))}</span></div>` : ''}
              <div class="row ${e.kind}">
                <span class="t">${esc(e.time)}</span><span class="x">${esc(e.text)}</span>
              </div>`;
          }).join('')}
        </div>
      </div>

      <div>
        <div class="band"><span class="lbl">Findings</span><span class="rest">${findings.length}</span></div>
        ${findings.length ? findings.map((f) => `
          <div class="finding sev${f.severity >= 4 ? 3 : f.severity >= 2 ? 2 : 1}">
            <div class="code">${esc(f.code)}</div>
            <h4>${esc(f.name)}</h4>
            <div class="stat">${esc(f.stat)}</div>
            <p>${esc(f.detail)}</p>
            ${f.evidence?.length ? `<ul>${f.evidence.map((e) => `<li>${esc(e.text)}</li>`).join('')}</ul>` : ''}
          </div>`).join('')
          : `<p>No behavioural patterns flagged in this run. That is a good sign, and it is also
             one run — the score weights recent runs, so do it again.</p>`}
      </div>
    </div>

    <div class="cols c-wide" style="margin-top:44px">
      <div>
        <div class="band"><span class="lbl">Prescription</span><span class="rest">in order</span></div>
        ${drills.map((d, i) => `
          <div class="drill">
            <span class="n">${String(i + 1).padStart(2, '0')}</span>
            <div>
              <b>${esc(d.name)}</b>
              <div class="goal">${esc(d.goal)}</div>
              <div class="why">${esc(d.why)}</div>
            </div>
            <button class="btn sm quiet" data-drill="${esc(d.id)}">Load</button>
          </div>`).join('')}
      </div>

      <div>
        <div class="band"><span class="lbl">XP earned</span><span class="rest">+${xp}</span></div>
        <div class="ledger">
          ${notes.map((n) => `<div class="row"><span class="amt">+${n.n}</span><span class="why">${esc(n.why)}</span></div>`).join('')}
        </div>
        <p class="src">XP is awarded for process, never for profit. A larger winner earns exactly
          the same as a small one — rewarding P&amp;L would train gambling.</p>
      </div>
    </div>

    <div style="margin-top:44px">
      <div class="band"><span class="lbl">Share</span></div>
      <div class="cols c2">
        <div id="card-host"></div>
        <div>
          <p>The card carries the finding, not a win screenshot. It is marked simulated, and it
             distinguishes a breach from a run that simply ended.</p>
          <div class="actions" style="margin-top:16px"><button class="btn sm" id="dl">Download card</button></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" id="again">Run it again</button>
      <button class="btn quiet" id="dash">See my record</button>
    </div>

    ${colophon()}
  </div></div>`;

  const cv = renderCard(a, { primary, score: score.score, grade: score.grade });
  cv.className = 'share-card';
  $('#card-host', main).appendChild(cv);
  $('#dl', main).addEventListener('click', () => download(cv, `challenge-ready-${a.status}.png`));

  main.querySelectorAll('[data-drill]').forEach((b) => b.addEventListener('click', () => {
    S.drill = DRILLS.find((d) => d.id === b.dataset.drill);
    toast(`Drill loaded — ${S.drill.name}`, 'guard');
    go('setup');
  }));
  $('#again', main).addEventListener('click', startRun);
  $('#dash', main).addEventListener('click', () => go('dashboard'));
}

// ═══ RECORD — report ground ═════════════════════════════════════════════════
function viewDashboard(main, score) {
  const runs = S.profile.runs;
  if (!runs.length || !score.components) {
    main.innerHTML = `<div class="paper"><div class="sheet narrow">
      <div class="empty">
        <div class="lbl" style="margin-bottom:12px">Unscored</div>
        <h2>You have not been tested yet.</h2>
        <p>One fifteen-minute run will tell you more about how you trade than fifteen videos will.</p>
        <button class="btn primary" id="go">Run the diagnostic</button>
      </div>
      ${colophon()}
    </div></div>`;
    $('#go', main).addEventListener('click', () => go('setup'));
    return;
  }

  const rec = recommendation(score.score, score.runs);
  const lvl = levelFor(S.profile.xp);
  const passes = runs.filter((r) => r.status === 'passed').length;

  main.innerHTML = `<div class="paper"><div class="sheet">

    <div class="band">
      <span class="lbl">Assessment</span>
      <span class="rest">${runs.length} run${runs.length === 1 ? '' : 's'} · ${passes} passed · ${S.profile.streak}-day streak</span>
    </div>

    <div class="cols c-wide">
      <div>
        <div class="score-head">
          ${dial(score.score, score.grade)}
          <div>
            <h2>Readiness</h2>
            <p id="disclosure" style="margin-top:8px;font-size:13px">${esc(score.disclosure)}</p>
          </div>
        </div>
        <div class="rec ${rec.level}">
          <span class="lbl">Recommendation</span>
          <p>${esc(rec.text)}</p>
        </div>
      </div>

      <div>
        <div class="band"><span class="lbl">Components</span><span class="rest">weighted</span></div>
        ${COMPONENTS.map((c) => {
          const v = Math.round(score.components[c.key]);
          const col = v >= 75 ? 'var(--ultra)' : v >= 50 ? 'var(--caution)' : 'var(--oxblood)';
          return `<div class="comp">
            <div class="top"><span>${esc(c.label)}</span><b style="color:${col}">${v}</b></div>
            <div class="track"><i style="width:${v}%;background:${col}"></i></div>
            <div class="blurb">${esc(c.blurb)}</div>
          </div>`;
        }).join('')}
        ${score.weakest ? `<div class="note" style="margin-top:16px">
          Weakest component: <em>${esc(score.weakest.label)}</em>. Fix this one first — it carries
          ${Math.round(score.weakest.weight * 100)}% of the score.</div>` : ''}
      </div>
    </div>

    <div class="cols c-wide" style="margin-top:44px">
      <div>
        <div class="band"><span class="lbl">Progression</span><span class="rest">${S.profile.xp} XP</span></div>
        <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:10px">
          <b class="num" style="font-size:30px;color:var(--ink-1)">L${lvl.level}</b>
          <span class="serif" style="font-size:20px">${esc(lvl.name)}</span>
        </div>
        <div class="comp" style="border:none;padding:0">
          <div class="track"><i style="width:${lvl.max ? 100 : Math.round((lvl.into / lvl.need) * 100)}%;background:var(--ink-1)"></i></div>
        </div>
        <p class="src">${lvl.max ? 'Maximum level.' : `${lvl.need - lvl.into} XP to level ${lvl.level + 1}.`}
          Level 7 is “Challenge Ready” and it is deliberately hard to reach — a badge that is easy
          to get is a badge nobody respects.</p>
      </div>

      <div>
        <div class="band"><span class="lbl">Drills</span><span class="rest">${DRILLS.length} available</span></div>
        ${DRILLS.slice(0, 5).map((d) => `
          <div class="drill">
            <span class="n">${esc(d.forMode)}</span>
            <div><b>${esc(d.name)}</b><div class="goal">${esc(d.goal)}</div></div>
            <button class="btn sm quiet" data-drill="${esc(d.id)}">Load</button>
          </div>`).join('')}
      </div>
    </div>

    <div style="margin-top:44px">
      <div class="band"><span class="lbl">Run record</span></div>
      <table class="hist">
        <thead><tr>
          <th>#</th><th>Programme</th><th>Outcome</th>
          <th class="r">Result</th><th class="r">Trades</th><th class="r">Days</th><th class="r">Cause</th>
        </tr></thead>
        <tbody>
        ${runs.slice().reverse().map((r, i) => {
          const p = r.balance - r.rs.accountSize;
          return `<tr>
            <td>${runs.length - i}</td>
            <td class="name">${esc(r.rs.firm)}</td>
            <td>${esc(r.status)}</td>
            <td class="r ${p >= 0 ? 'pos' : 'neg'}">${money(p, true)}</td>
            <td class="r">${r.trades.length}</td>
            <td class="r">${r.tradingDays.length}</td>
            <td class="r">${r.breach ? esc(r.breach.code.replace('_', ' ').toLowerCase()) : '—'}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>

    <div class="actions">
      <button class="btn primary" id="new">New run</button>
      <button class="btn danger sm" id="reset">Erase my record</button>
    </div>

    ${colophon()}
  </div></div>`;

  main.querySelectorAll('[data-drill]').forEach((b) => b.addEventListener('click', () => {
    S.drill = DRILLS.find((d) => d.id === b.dataset.drill);
    toast(`Drill loaded — ${S.drill.name}`, 'guard');
    go('setup');
  }));
  $('#new', main).addEventListener('click', () => go('setup'));
  $('#reset', main).addEventListener('click', () => {
    if (!confirm('Erase every run, your XP and your streak? This cannot be undone.')) return;
    S.profile = { runs: [], xp: 0, streak: 0, lastDay: null, completedDrills: [] };
    saveProfile(S.profile);
    go('dashboard');
  });
}

function dial(score, grade) {
  const r = 62, c = 2 * Math.PI * r;
  const pct = (score ?? 0) / 100;
  const col = score >= 75 ? 'var(--ultra)' : score >= 50 ? 'var(--caution)' : 'var(--oxblood)';
  return `<div class="dial">
    <svg width="148" height="148" viewBox="0 0 148 148" aria-hidden="true">
      <circle cx="74" cy="74" r="${r}" fill="none" stroke="var(--paper-rule)" stroke-width="6"/>
      <circle cx="74" cy="74" r="${r}" fill="none" stroke="${col}" stroke-width="6"
        stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}" transform="rotate(-90 74 74)"/>
    </svg>
    <div class="g"><b>${score ?? '—'}</b><small>GRADE ${grade ?? '—'}</small></div>
  </div>`;
}

/** "Mon 5 Jan" — enough to orient without competing with the event times. */
function dayLabel(iso) {
  const d = new Date(iso + 'T00:00:00Z');
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
}

function colophon() {
  return `<div class="colophon">
    Simulated trading on synthetic data. Nothing here is real market data, a real trading record,
    a prediction, or financial advice. Rule sets are models of publicly documented evaluation
    formats and are not affiliated with any firm — always verify current terms with the firm itself.
  </div>`;
}

render();

return {  };
})();
</script>
