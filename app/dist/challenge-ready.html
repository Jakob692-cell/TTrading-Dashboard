<title>Challenge Ready — prop firm challenge simulator</title>
<meta name="description" content="Practise a prop firm challenge under the exact rules before you pay for one. Simulated trading on synthetic data.">
<meta name="color-scheme" content="dark">
<style>
/* Challenge Ready — V1
   Colour note: P&L uses teal/red rather than green/red. ~8% of men have red-green colour
   vision deficiency and this audience skews ~69% male, so the most safety-critical number
   in the product must not depend on a red/green distinction. Every value also carries an
   explicit +/- sign so colour is never the only channel. */

:root {
  --bg:      #0B0E11;
  --panel:   #12171E;
  --panel-2: #171E26;
  --line:    #232C36;
  --fg:      #E6EDF3;
  --muted:   #8B99A6;
  --dim:     #5D6B78;
  --teal:    #00C9A7;
  --red:     #FF4757;
  --amber:   #FFB020;
  --blue:    #4C8DFF;
  --radius:  10px;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
button:disabled { cursor: not-allowed; opacity: .38; }
input, select { font: inherit; color: inherit; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ── shell ─────────────────────────────────────────────────────────────── */
#app { min-height: 100%; display: flex; flex-direction: column; }

.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 18px; border-bottom: 1px solid var(--line);
  background: var(--panel); flex-shrink: 0;
}
.logo { font-weight: 700; letter-spacing: -.02em; font-size: 15px; }
.logo span { color: var(--teal); }
.sim-badge {
  font-size: 10px; font-weight: 700; letter-spacing: .09em;
  padding: 3px 8px; border-radius: 4px;
  background: rgba(255,176,32,.13); color: var(--amber);
  border: 1px solid rgba(255,176,32,.32);
}
.topbar .spacer { flex: 1; }
.topbar nav { display: flex; gap: 4px; }
.topbar nav button {
  padding: 6px 12px; border-radius: 7px; color: var(--muted); font-size: 13px;
}
.topbar nav button:hover { background: var(--panel-2); color: var(--fg); }
.topbar nav button.on { background: var(--panel-2); color: var(--fg); }

.lvl {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--muted);
  padding: 4px 10px; border: 1px solid var(--line); border-radius: 20px;
}
.lvl b { color: var(--fg); font-weight: 600; }
.lvl .bar { width: 54px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.lvl .bar i { display: block; height: 100%; background: var(--teal); }

main { flex: 1; display: flex; flex-direction: column; min-height: 0; }

/* ── generic bits ──────────────────────────────────────────────────────── */
.wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; width: 100%; }
.wrap.narrow { max-width: 720px; }
h1 { font-size: 30px; font-weight: 700; letter-spacing: -.025em; line-height: 1.15; }
h2 { font-size: 19px; font-weight: 650; letter-spacing: -.015em; margin-bottom: 4px; }
h3 { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
p  { color: var(--muted); line-height: 1.6; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, 1fr); }
.g3 { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 860px) { .g2, .g3 { grid-template-columns: 1fr; } }

.btn {
  padding: 11px 18px; border-radius: 8px; font-weight: 600; font-size: 14px;
  background: var(--panel-2); border: 1px solid var(--line); transition: .12s;
}
.btn:hover:not(:disabled) { border-color: var(--dim); }
.btn.primary { background: var(--teal); color: #04231D; border-color: var(--teal); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.danger  { background: rgba(255,71,87,.12); color: var(--red); border-color: rgba(255,71,87,.35); }
.btn.big { padding: 14px 26px; font-size: 15px; }
.btn.sm { padding: 7px 12px; font-size: 13px; }

.pos { color: var(--teal); } .neg { color: var(--red); } .warn { color: var(--amber); }

.pill { display:inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600;
        background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }

/* ── landing ───────────────────────────────────────────────────────────── */
.hero { text-align: center; padding: 56px 0 34px; }
.hero h1 { max-width: 700px; margin: 0 auto 14px; font-size: 38px; }
.hero .sub { max-width: 560px; margin: 0 auto 26px; font-size: 16px; }
.stat-row { display: flex; gap: 34px; justify-content: center; margin: 30px 0 8px; flex-wrap: wrap; }
.stat-row div { text-align: center; }
.stat-row b { display: block; font-size: 28px; font-family: var(--mono); font-weight: 600; }
.stat-row small { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
.src { font-size: 11px; color: var(--dim); margin-top: 18px; }
.src a { color: var(--dim); }

/* ── setup ─────────────────────────────────────────────────────────────── */
.firm-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
@media (max-width: 760px) { .firm-grid { grid-template-columns: 1fr; } }
.firm {
  text-align: left; padding: 14px; border-radius: 9px;
  background: var(--panel); border: 1px solid var(--line); transition: .12s;
}
.firm:hover { border-color: var(--dim); }
.firm.on { border-color: var(--teal); background: rgba(0,201,167,.06); }
.firm b { display: block; font-size: 14px; margin-bottom: 2px; }
.firm small { color: var(--muted); font-size: 12px; }
.firm .dd { margin-top: 8px; font-size: 11px; color: var(--dim); font-family: var(--mono); }

.rules-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.rules-table td { padding: 8px 0; border-bottom: 1px solid var(--line); }
.rules-table td:first-child { color: var(--muted); width: 46%; }
.rules-table td:last-child { font-family: var(--mono); text-align: right; }
.rules-table tr:last-child td { border-bottom: none; }

.note { font-size: 12.5px; color: var(--muted); line-height: 1.55;
        padding: 11px 13px; border-left: 2px solid var(--line); background: var(--panel-2);
        border-radius: 0 6px 6px 0; }

.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; }
.field label { font-size: 13.5px; }
.field small { display: block; color: var(--dim); font-size: 11.5px; margin-top: 2px; }
.field input, .field select {
  background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
  padding: 7px 10px; width: 118px; font-family: var(--mono); font-size: 13px;
}
.field input[type=checkbox] { width: auto; accent-color: var(--teal); }

/* ── trading screen ────────────────────────────────────────────────────── */
.trade-shell { display: flex; flex-direction: column; height: calc(100vh - 49px); }

.hud {
  display: flex; align-items: stretch; gap: 1px; background: var(--line);
  border-bottom: 1px solid var(--line); flex-shrink: 0;
}
.hud .cell { flex: 1; background: var(--panel); padding: 8px 13px; min-width: 0; }
.hud .cell .k { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); }
.hud .cell .v { font-family: var(--mono); font-size: 17px; font-weight: 600; margin-top: 1px;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud .cell .meter { height: 3px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.hud .cell .meter i { display: block; height: 100%; background: var(--teal); transition: width .2s, background .2s; }
.hud .cell.amber .meter i { background: var(--amber); }
.hud .cell.red   .meter i { background: var(--red); }
.hud .cell.amber .v { color: var(--amber); }
.hud .cell.red   .v { color: var(--red); }
.hud .cell small { font-size: 10.5px; color: var(--dim); }

.chart-area { flex: 1; position: relative; min-height: 0; background: var(--bg); }
.chart-area canvas { display: block; width: 100%; height: 100%; }
.chart-overlay {
  position: absolute; top: 10px; left: 12px; font-size: 11.5px;
  color: var(--muted); font-family: var(--mono); pointer-events: none; line-height: 1.6;
}

.ticker { position:absolute; top:10px; right:12px; text-align:right; font-family: var(--mono);
          font-size: 11.5px; color: var(--muted); pointer-events:none; line-height:1.6; }

.order-bar {
  display: flex; align-items: center; gap: 8px; padding: 9px 13px;
  border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; flex-shrink: 0;
}
.order-bar .grp { display: flex; align-items: center; gap: 6px; }
.order-bar label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.order-bar input, .order-bar select {
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 8px; width: 68px; font-family: var(--mono); font-size: 13px;
}
.order-bar .sep { width: 1px; height: 26px; background: var(--line); }
.buy  { background: rgba(0,201,167,.14); color: var(--teal); border: 1px solid rgba(0,201,167,.4); }
.sell { background: rgba(76,141,255,.14); color: var(--blue); border: 1px solid rgba(76,141,255,.4); }
.flat { background: var(--panel-2); border: 1px solid var(--line); }

.speed { display: flex; gap: 3px; }
.speed button { padding: 5px 9px; border-radius: 5px; font-size: 12px; font-family: var(--mono);
                background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.speed button.on { color: var(--teal); border-color: var(--teal); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px; z-index: 60;
  padding: 12px 18px; border-radius: 9px; font-size: 13.5px; font-weight: 500;
  background: var(--panel); border: 1px solid var(--line); box-shadow: 0 12px 34px rgba(0,0,0,.5);
  max-width: 460px;
}
.toast.block { border-color: rgba(255,176,32,.45); color: var(--amber); }
.toast.guard { border-color: rgba(0,201,167,.45); color: var(--teal); }

.pos-strip { display:flex; align-items:center; gap:14px; padding: 7px 13px; background: var(--panel-2);
             border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12.5px; flex-shrink:0; }

/* ── autopsy ───────────────────────────────────────────────────────────── */
.verdict { text-align: center; padding: 30px 0 22px; }
.verdict .tag {
  display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .12em;
  padding: 5px 12px; border-radius: 5px; margin-bottom: 14px;
}
.verdict.fail .tag { background: rgba(255,71,87,.14); color: var(--red); border: 1px solid rgba(255,71,87,.4); }
.verdict.pass .tag { background: rgba(0,201,167,.14); color: var(--teal); border: 1px solid rgba(0,201,167,.4); }
.verdict h1 { font-size: 32px; margin-bottom: 8px; }

.timeline { font-family: var(--mono); font-size: 12.5px; }
.timeline .row { display: flex; gap: 12px; padding: 6px 0; border-bottom: 1px solid rgba(35,44,54,.55); }
.timeline .row:last-child { border-bottom: none; }
.timeline .t { color: var(--dim); width: 46px; flex-shrink: 0; }
.timeline .row.loss .x, .timeline .row.breach .x { color: var(--red); }
.timeline .row.win .x  { color: var(--teal); }
.timeline .row.blocked .x, .timeline .row.floor .x { color: var(--amber); }
.timeline .row.guard .x { color: var(--teal); }
.timeline .row.pass .x  { color: var(--teal); font-weight: 600; }
.timeline .row.breach   { background: rgba(255,71,87,.07); margin: 0 -8px; padding: 7px 8px; border-radius: 5px; }

.finding { border-left: 3px solid var(--red); padding: 12px 0 12px 14px; margin-bottom: 14px; }
.finding.sev2 { border-color: var(--amber); }
.finding.sev1 { border-color: var(--dim); }
.finding .code { font-family: var(--mono); font-size: 11px; color: var(--dim); }
.finding h4 { font-size: 15.5px; font-weight: 650; margin: 2px 0 5px; }
.finding .stat { font-family: var(--mono); font-size: 12.5px; color: var(--amber); margin-bottom: 6px; }
.finding p { font-size: 13.5px; }
.finding ul { list-style: none; margin-top: 8px; font-family: var(--mono); font-size: 12px; color: var(--dim); }
.finding li { padding: 3px 0 3px 12px; border-left: 1px solid var(--line); }

/* ── score ─────────────────────────────────────────────────────────────── */
.score-hero { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
.dial { position: relative; width: 132px; height: 132px; flex-shrink: 0; }
.dial .g { position: absolute; inset: 0; display: flex; flex-direction: column;
           align-items: center; justify-content: center; }
.dial .g b { font-size: 40px; font-weight: 700; line-height: 1; font-family: var(--mono); }
.dial .g small { font-size: 11px; color: var(--dim); letter-spacing: .1em; margin-top: 3px; }

.comp { margin-bottom: 11px; }
.comp .top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.comp .top b { font-family: var(--mono); font-weight: 600; }
.comp .track { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.comp .track i { display: block; height: 100%; border-radius: 3px; }

.rec { padding: 14px 16px; border-radius: 9px; font-size: 14px; line-height: 1.55; }
.rec.stop  { background: rgba(255,71,87,.09);  border: 1px solid rgba(255,71,87,.3);  color: #FFB3BA; }
.rec.wait  { background: rgba(255,176,32,.09); border: 1px solid rgba(255,176,32,.3); color: #FFD79A; }
.rec.close { background: rgba(76,141,255,.09); border: 1px solid rgba(76,141,255,.3); color: #B7D0FF; }
.rec.ready { background: rgba(0,201,167,.09);  border: 1px solid rgba(0,201,167,.3);  color: #9BEBD9; }
.rec.unknown { background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }

.drill { display: flex; gap: 13px; align-items: flex-start; padding: 13px 0; border-bottom: 1px solid var(--line); }
.drill:last-child { border-bottom: none; }
.drill .n { width: 26px; height: 26px; border-radius: 7px; background: var(--panel-2);
            display: grid; place-items: center; font-family: var(--mono); font-size: 12px;
            color: var(--muted); flex-shrink: 0; }
.drill b { font-size: 14px; }
.drill .goal { font-size: 13px; color: var(--muted); margin-top: 2px; }
.drill .why  { font-size: 12.5px; color: var(--dim); margin-top: 5px; font-style: italic; }

.empty { text-align: center; padding: 40px 20px; }
.empty p { max-width: 380px; margin: 8px auto 16px; }

.hist { width: 100%; border-collapse: collapse; font-size: 13px; }
.hist th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
           color: var(--dim); padding: 8px 10px 8px 0; font-weight: 600; }
.hist td { padding: 9px 10px 9px 0; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12.5px; }

.share-card { border: 1px solid var(--line); border-radius: 9px; max-width: 100%; display: block; }

footer { border-top: 1px solid var(--line); padding: 18px; text-align: center;
         font-size: 11.5px; color: var(--dim); line-height: 1.7; }
footer a { color: var(--dim); }

/* The host page may supply its own body background; make sure ours wins. */
html, body { background: #0B0E11 !important; color: #E6EDF3; }

    inNewsWindow: inNewsWindow(S.session, bar.t, S.account.rs.newsWindowMin),
  });
  S.account = r.state;
  if (r.rejected) {
    const isGuard = String(r.rejected).startsWith('GUARD');
    toast(r.message || 'Order rejected', isGuard ? 'guard' : 'block');
  }
  paintTrade();
}

function flatten() {
  if (!S.account?.position) return;
  const bar = S.session.bars[S.cursor - 1];
  S.account = closePosition(S.account, bar.c).state;
  if (S.account.status !== 'active') { finish(S.account.status); return; }
  paintTrade();
}

function paintTrade() {
  if (S.view !== 'trade' || !S.account) return;
  const a = S.account;
  const h = hud(a);
  const bar = S.session.bars[S.cursor - 1];

  // HUD — order is fixed and it never scrolls or collapses.
  const cells = [
    cell('Equity', money(h.equity), null, `Bal ${money(h.balance)}`),
    cell('Daily limit', h.dailyRoom === null ? '—' : money(h.dailyRoom) + ' left',
         h.dailyPct, h.dailyFloor === null ? 'No daily rule' : `Floor ${money(h.dailyFloor)}`),
    cell('Max loss floor', money(h.floorRoom) + ' left', h.floorPct,
         `${money(h.floor)}${h.floorLocked ? ' · LOCKED' : ddArrow(a.rs.maxLossType)}`),
    cell('Target', money(h.profit) + ' / ' + money(h.target), h.targetPct, `${Math.round(h.targetPct * 100)}%`, true),
    cell('Day', `${h.day}${h.maxDays ? ' / ' + h.maxDays : ''}`, null,
         `${h.tradingDays}/${h.minTradingDays} trading days`),
    cell('Trades today', `${h.tradesToday}${h.tradeCap !== null ? ' / ' + h.tradeCap : ''}`, null,
         h.consistencyPct !== null ? `Best day ${Math.round(h.consistencyPct * 100)}%` : 'No consistency rule'),
  ];
  $('#hud').innerHTML = cells.join('');

  // Chart
  const visible = 190;
  const from = Math.max(0, S.cursor - visible * S.tf);
  const bars = resample(S.session.bars.slice(from, S.cursor), S.tf);

  const levels = [];
  if (a.position) {
    const pv = a.instrument.pointValue;
    const fp = equityToPrice(a.position, bar.c, pv, a.balance, a.floor);
    if (fp !== null && Number.isFinite(fp)) levels.push({ price: fp, color: '#FF4757', label: 'FLOOR', dashed: false, bold: true, inRangeOnly: true });
    if (a.dailyFloor !== null) {
      const dp = equityToPrice(a.position, bar.c, pv, a.balance, a.dailyFloor);
      if (dp !== null && Number.isFinite(dp)) levels.push({ price: dp, color: '#FFB020', label: 'DAILY', dashed: true, inRangeOnly: true });
    }
  }
  chart.set({
    bars, position: a.position, levels, trades: a.trades.slice(-24),
    news: S.session.news, digits: a.instrument.digits, tf: S.tf,
  });

  const upl = a.position
    ? (bar.c - a.position.entryPrice) * (a.position.side === 'long' ? 1 : -1) * a.position.size * a.instrument.pointValue
    : 0;

  $('#ov').innerHTML = `${esc(a.instrument.name)} · ${S.tf}m<br>
    <span style="color:#5D6B78">synthetic seed ${esc(S.session.seed)}</span>`;
  $('#tk').innerHTML = `${bar.c.toFixed(a.instrument.digits)}<br>
    <span style="color:#5D6B78">${new Date(bar.t).toISOString().slice(0, 16).replace('T', ' ')}</span>`;

  const warn = h.warnings.filter((w) => w.code !== 'CONSISTENCY_BLOCK');
  const cd = h.cooldownUntil && bar.t < h.cooldownUntil
    ? `<span class="warn">COOLDOWN ${Math.ceil((h.cooldownUntil - bar.t) / 60000)}m</span>` : '';
  $('#ps').innerHTML = a.position
    ? `<span class="${a.position.side === 'long' ? 'pos' : ''}" style="color:${a.position.side === 'long' ? 'var(--teal)' : 'var(--blue)'}">
         ${a.position.side.toUpperCase()} ${a.position.size} @ ${a.position.entryPrice.toFixed(a.instrument.digits)}</span>
       <span class="${upl >= 0 ? 'pos' : 'neg'}">${money(upl, true)} open</span>
       ${a.position.stop ? `<span style="color:var(--dim)">SL ${a.position.stop.toFixed(a.instrument.digits)}</span>` : ''}
       ${a.position.target ? `<span style="color:var(--dim)">TP ${a.position.target.toFixed(a.instrument.digits)}</span>` : ''}
       ${cd}
       ${warn.map((w) => `<span class="${w.sev === 2 ? 'neg' : 'warn'}">${esc(w.msg)}</span>`).join('')}`
    : `<span style="color:var(--dim)">Flat</span> ${cd}
       ${warn.map((w) => `<span class="${w.sev === 2 ? 'neg' : 'warn'}">${esc(w.msg)}</span>`).join('')}`;
}

function cell(k, v, pct, sub, invert = false) {
  let cls = '';
  if (pct !== null && pct !== undefined) {
    // For headroom meters low is bad; for the target meter low is just early.
    if (!invert) cls = pct <= 0.15 ? 'red' : pct <= 0.3 ? 'amber' : '';
  }
  const width = pct === null || pct === undefined ? null : Math.round(pct * 100);
  return `<div class="cell ${cls}">
    <div class="k">${esc(k)}</div>
    <div class="v">${esc(v)}</div>
    ${width === null ? `<small>${esc(sub || '')}</small>`
      : `<div class="meter"><i style="width:${width}%"></i></div><small>${esc(sub || '')}</small>`}
  </div>`;
}

const ddArrow = (t) => (t === 'static' ? ' · fixed' : ' · trailing');
const ddLabel = (t) => ({
  static: 'Static DD', trailing_intraday: 'Intraday trailing',
  trailing_eod: 'EOD trailing', trailing_to_static: 'Trailing→lock',
}[t]);

// ── finish + autopsy ────────────────────────────────────────────────────────
function finish() {
  stop();
  // A run that neither passed nor breached still terminates — record it as 'ended' rather
  // than leaving it 'active', or it will never be scored and the dashboard has nothing to show.
  if (S.account.status === 'active') S.account = { ...S.account, status: 'ended' };
  const a = S.account;
  const { findings, primary, metrics } = classify(a);
  const { xp, notes } = xpForRun(a, findings);

  const profile = { ...S.profile };
  profile.runs = [...profile.runs, slimRun(a)].slice(-40);
  profile.xp += xp;
  const today = new Date().toISOString().slice(0, 10);
  if (profile.lastDay !== today) {
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    profile.streak = profile.lastDay === yesterday ? profile.streak + 1 : 1;
    profile.lastDay = today;
  }
  S.profile = profile;
  saveProfile(profile);

  S.lastResult = { findings, primary, metrics, xp, notes, drills: drillsFor(findings) };
  go('autopsy');
}

function viewAutopsy(main, score) {
  const a = S.account;
  const { findings, primary, xp, notes, drills } = S.lastResult;
  const passed = a.status === 'passed';
  const events = narrative(a, 14);
  const profit = a.balance - a.rs.accountSize;

  main.innerHTML = `
    <div class="wrap">
      <div class="verdict ${passed ? 'pass' : 'fail'}">
        <div class="tag">${passed ? 'CHALLENGE PASSED' : a.breach ? 'CHALLENGE FAILED' : 'RUN ENDED'} · SIMULATED</div>
        <h1>${passed ? `Passed in ${a.tradingDays.length} trading days`
            : a.breach ? esc(a.breach.detail) : 'You ended the run early'}</h1>
        <p>${esc(a.rs.firm)} · ${esc(a.rs.label)} · result ${money(profit, true)} over ${a.trades.length} trades</p>
      </div>

      ${primary && !passed ? `
      <div class="card" style="margin-bottom:16px;border-color:rgba(255,71,87,.35)">
        <div class="finding" style="border:none;padding:0;margin:0">
          <div class="code">PRIMARY PATTERN · ${esc(primary.code)}</div>
          <h4 style="font-size:22px">${esc(primary.name)}</h4>
          <div class="stat">${esc(primary.stat)}</div>
          <p>${esc(primary.detail)}</p>
        </div>
      </div>` : ''}

      <div class="grid g2" style="margin-bottom:16px">
        <div class="card">
          <h3 style="margin-bottom:10px">What actually happened</h3>
          <div class="timeline">
            ${events.map((e) => `<div class="row ${e.kind}">
              <span class="t">${esc(e.time)}</span><span class="x">${esc(e.text)}</span></div>`).join('')}
          </div>
        </div>

        <div class="card">
          <h3 style="margin-bottom:10px">Everything we found</h3>
          ${findings.length ? findings.map((f) => `
            <div class="finding sev${f.severity >= 4 ? 3 : f.severity >= 2 ? 2 : 1}">
              <div class="code">${esc(f.code)}</div>
              <h4>${esc(f.name)}</h4>
              <div class="stat">${esc(f.stat)}</div>
              <p>${esc(f.detail)}</p>
              ${f.evidence?.length ? `<ul>${f.evidence.map((e) => `<li>${esc(e.text)}</li>`).join('')}</ul>` : ''}
            </div>`).join('')
            : `<p>No behavioural patterns flagged in this run. That is a good sign, and it is also
               only one run — the score weights recent runs, so do it again.</p>`}
        </div>
      </div>

      <div class="grid g2" style="margin-bottom:16px">
        <div class="card">
          <h3 style="margin-bottom:10px">Your drills</h3>
          ${drills.map((d, i) => `
            <div class="drill">
              <div class="n">${i + 1}</div>
              <div>
                <b>${esc(d.name)}</b>
                <div class="goal">${esc(d.goal)}</div>
                <div class="why">${esc(d.why)}</div>
                <button class="btn sm" data-drill="${d.id}" style="margin-top:8px">Load this drill →</button>
              </div>
            </div>`).join('')}
        </div>

        <div class="card">
          <h3 style="margin-bottom:10px">XP earned · +${xp}</h3>
          <div class="timeline">
            ${notes.map((n) => `<div class="row"><span class="t num">+${n.n}</span><span class="x">${esc(n.why)}</span></div>`).join('')}
          </div>
          <p class="src" style="margin-top:12px">
            XP is awarded for process, never for profit. A bigger winner earns exactly the same
            as a small one — rewarding P&amp;L would train gambling.
          </p>
        </div>
      </div>

      <div class="card" style="margin-bottom:16px">
        <h3 style="margin-bottom:12px">Share this</h3>
        <div id="card-host" style="margin-bottom:12px"></div>
        <button class="btn" id="dl">Download the card</button>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn primary" id="again">Run it again →</button>
        <button class="btn" id="dash">See my readiness score</button>
      </div>
    </div>
    ${footer()}`;

  const cv = renderCard(a, { primary, score: score.score, grade: score.grade });
  cv.className = 'share-card';
  cv.style.width = '100%';
  $('#card-host', main).appendChild(cv);
  $('#dl', main).addEventListener('click', () => download(cv, `challenge-ready-${a.status}.png`));

  main.querySelectorAll('[data-drill]').forEach((b) => b.addEventListener('click', () => {
    S.drill = DRILLS.find((d) => d.id === b.dataset.drill);
    toast(`Drill loaded: ${S.drill.name}`, 'guard');
    go('setup');
  }));
  $('#again', main).addEventListener('click', startRun);
  $('#dash', main).addEventListener('click', () => go('dashboard'));
}

// ── DASHBOARD ───────────────────────────────────────────────────────────────
function viewDashboard(main, score) {
  const runs = S.profile.runs;
  if (!runs.length || !score.components) {
    main.innerHTML = `<div class="wrap narrow"><div class="card empty">
      <h2>Unscored</h2>
      <p>You haven't been tested yet. One 15-minute run will tell you more about your trading
         than fifteen videos will.</p>
      <button class="btn primary" id="go">Run the diagnostic →</button>
    </div></div>${footer()}`;
    $('#go', main).addEventListener('click', () => go('setup'));
    return;
  }

  const rec = recommendation(score.score, score.runs);
  const lvl = levelFor(S.profile.xp);
  const passes = runs.filter((r) => r.status === 'passed').length;

  main.innerHTML = `
    <div class="wrap">
      <div class="grid g2" style="margin-bottom:16px">
        <div class="card">
          <div class="score-hero">
            ${dial(score.score, score.grade)}
            <div style="flex:1;min-width:200px">
              <h2>Readiness Score</h2>
              <p style="font-size:13px">${esc(score.disclosure)}</p>
              <div style="margin-top:12px;display:flex;gap:18px;font-size:13px">
                <span><b class="num">${runs.length}</b> <span style="color:var(--dim)">runs</span></span>
                <span><b class="num">${passes}</b> <span style="color:var(--dim)">passed</span></span>
                <span><b class="num">${S.profile.streak}</b> <span style="color:var(--dim)">day streak</span></span>
              </div>
            </div>
          </div>
          <div class="rec ${rec.level}" style="margin-top:16px">${esc(rec.text)}</div>
        </div>

        <div class="card">
          <h3 style="margin-bottom:12px">Components</h3>
          ${COMPONENTS.map((c) => {
            const v = Math.round(score.components[c.key]);
            const col = v >= 75 ? 'var(--teal)' : v >= 50 ? 'var(--amber)' : 'var(--red)';
            return `<div class="comp">
              <div class="top"><span>${esc(c.label)}</span><b class="num">${v}</b></div>
              <div class="track"><i style="width:${v}%;background:${col}"></i></div>
              <div style="font-size:11.5px;color:var(--dim);margin-top:3px">${esc(c.blurb)}</div>
            </div>`;
          }).join('')}
          ${score.weakest ? `<div class="note" style="margin-top:12px">
            Weakest component: <b style="color:var(--fg)">${esc(score.weakest.label)}</b>. Fix this one first —
            it carries ${Math.round(score.weakest.weight * 100)}% of the score.</div>` : ''}
        </div>
      </div>

      <div class="grid g2" style="margin-bottom:16px">
        <div class="card">
          <h3 style="margin-bottom:12px">Progression</h3>
          <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:8px">
            <b style="font-size:26px">L${lvl.level}</b>
            <span style="font-size:16px">${esc(lvl.name)}</span>
          </div>
          <div class="comp"><div class="track">
            <i style="width:${lvl.max ? 100 : Math.round((lvl.into / lvl.need) * 100)}%;background:var(--teal)"></i>
          </div></div>
          <div style="font-size:12.5px;color:var(--dim);margin-top:6px">
            ${lvl.max ? 'Max level' : `${lvl.need - lvl.into} XP to level ${lvl.level + 1}`}
          </div>
          <div class="note" style="margin-top:14px">
            Level 7 is "Challenge Ready" and it is deliberately hard to reach. A badge that is
            easy to get is a badge nobody respects.
          </div>
        </div>

        <div class="card">
          <h3 style="margin-bottom:12px">Available drills</h3>
          <div style="max-height:230px;overflow:auto">
            ${DRILLS.slice(0, 6).map((d) => `
              <div class="drill">
                <div class="n">${esc(d.forMode)}</div>
                <div style="flex:1">
                  <b>${esc(d.name)}</b>
                  <div class="goal">${esc(d.goal)}</div>
                </div>
                <button class="btn sm" data-drill="${d.id}">Load</button>
              </div>`).join('')}
          </div>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-bottom:12px">Run history</h3>
        <table class="hist">
          <tr><th>#</th><th>Ruleset</th><th>Result</th><th>P&amp;L</th><th>Trades</th><th>Days</th><th>Cause</th></tr>
          ${runs.slice().reverse().map((r, i) => {
            const p = r.balance - r.rs.accountSize;
            return `<tr>
              <td>${runs.length - i}</td>
              <td>${esc(r.rs.firm)}</td>
              <td class="${r.status === 'passed' ? 'pos' : r.status === 'failed' ? 'neg' : ''}">${esc(r.status)}</td>
              <td class="${p >= 0 ? 'pos' : 'neg'}">${money(p, true)}</td>
              <td>${r.trades.length}</td>
              <td>${r.tradingDays.length}</td>
              <td style="color:var(--dim)">${r.breach ? esc(r.breach.code) : '—'}</td>
            </tr>`;
          }).join('')}
        </table>
      </div>

      <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
        <button class="btn primary" id="new">New run →</button>
        <button class="btn danger" id="reset">Reset all my data</button>
      </div>
    </div>
    ${footer()}`;

  main.querySelectorAll('[data-drill]').forEach((b) => b.addEventListener('click', () => {
    S.drill = DRILLS.find((d) => d.id === b.dataset.drill);
    toast(`Drill loaded: ${S.drill.name}`, 'guard');
    go('setup');
  }));
  $('#new', main).addEventListener('click', () => go('setup'));
  $('#reset', main).addEventListener('click', () => {
    if (!confirm('Delete every run, your XP and your streak? This cannot be undone.')) return;
    S.profile = { runs: [], xp: 0, streak: 0, lastDay: null, completedDrills: [] };
    saveProfile(S.profile);
    go('dashboard');
  });
}

function dial(score, grade) {
  const r = 56, c = 2 * Math.PI * r;
  const pct = (score ?? 0) / 100;
  const col = score >= 75 ? '#00C9A7' : score >= 50 ? '#FFB020' : '#FF4757';
  return `<div class="dial">
    <svg width="132" height="132" viewBox="0 0 132 132">
      <circle cx="66" cy="66" r="${r}" fill="none" stroke="#171E26" stroke-width="10"/>
      <circle cx="66" cy="66" r="${r}" fill="none" stroke="${col}" stroke-width="10"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}"
        transform="rotate(-90 66 66)"/>
    </svg>
    <div class="g"><b style="color:${col}">${score ?? '—'}</b><small>GRADE ${grade ?? '—'}</small></div>
  </div>`;
}

function footer() {
  return `<footer>
    Simulated trading on synthetic data. Nothing here is real market data, a real trading record,
    a prediction, or financial advice. Rule sets are models of publicly documented evaluation
    formats and are not affiliated with any firm — always verify current terms with the firm itself.
  </footer>`;
}

render();

return {  };
})();
</script>
