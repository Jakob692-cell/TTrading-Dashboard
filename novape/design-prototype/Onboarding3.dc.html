<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NoVape · Starting point</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#111111;text-decoration:none}a:hover{color:#111111}
button{font:inherit;color:inherit}
.press{transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.press:active{transform:scale(.96)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
.fade{animation:fadeUp .6s cubic-bezier(.22,1,.36,1) both}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;margin:0;background:transparent;position:relative;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:999px;background:#FFFFFF;border:1px solid #E6E6E8;box-shadow:0 2px 10px rgba(17,17,17,.14);margin-top:-12px}
input[type=range]::-moz-range-track{height:6px;background:transparent}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:999px;background:#FFFFFF;border:1px solid #E6E6E8;box-shadow:0 2px 10px rgba(17,17,17,.14)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #111111; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; box-sizing: border-box; padding: 52px 24px 40px 24px">
<div style="display: flex; align-items: center; gap: 16px">
<a href="Onboarding2.dc.html" aria-label="Back" style="width: 40px; height: 40px; margin-left: -8px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div aria-label="Step 2 of 4" style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-right: 32px">
<span style="height: 4px; border-radius: 999px; background: #7FBF9A"></span>
<span style="height: 4px; border-radius: 999px; background: #7FBF9A"></span>
<span style="height: 4px; border-radius: 999px; background: #EFEFF0"></span>
<span style="height: 4px; border-radius: 999px; background: #EFEFF0"></span>
</div>
</div>
<div class="fade" style="margin-top: 36px; display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.035em">How often do you currently vape?</h1>
<p style="margin: 0; font-size: 16px; line-height: 23px; color: #777777">A rough estimate is completely fine.</p>
</div>

<div class="fade" style="margin-top: 56px; display: flex; flex-direction: column; align-items: center; gap: 36px; animation-delay: 120ms">
<div style="display: flex; align-items: center; gap: 28px">
<button type="button" class="press" onClick="{{dec}}" aria-label="Decrease by 5" style="width: 48px; height: 48px; border-radius: 999px; border: 1px solid #EAEAEA; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"></path></svg></button>
<div style="display: flex; flex-direction: column; align-items: center; min-width: 150px">
<span style="font-size: 88px; line-height: 92px; font-weight: 700; letter-spacing: -0.06em">{{value}}</span>
<span style="font-size: 16px; color: #777777">uses per day</span>
</div>
<button type="button" class="press" onClick="{{inc}}" aria-label="Increase by 5" style="width: 48px; height: 48px; border-radius: 999px; border: 1px solid #EAEAEA; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round"><path d="M6 12h12M12 6v12"></path></svg></button>
</div>
<div style="width: 100%; display: flex; flex-direction: column; gap: 8px">
<div style="position: relative; height: 32px">
<div style="position: absolute; left: 0; right: 0; top: 13px; height: 6px; border-radius: 999px; background: #EFEFF0"></div>
<div style="position: absolute; left: 0; top: 13px; height: 6px; width: {{pct}}%; border-radius: 999px; background: #7FBF9A"></div>
<input type="range" min="10" max="300" step="5" value="{{value}}" onChange="{{onSlide}}" aria-label="Uses per day" style="position: absolute; left: 0; top: 0; width: 100%">
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #9A9AA0">
<span>10</span>
<span>300+</span>
</div>
</div>
</div>

<div class="fade" style="margin-top: 40px; background: #F7F7F8; border-radius: 18px; padding: 16px 18px; display: flex; gap: 12px; animation-delay: 200ms">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#777777" stroke-width="1.7" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5.5"></path><circle cx="12" cy="7.8" r=".6" fill="#777777"></circle></svg>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #555555"><span style="color: #111111; font-weight: 600">This gives us your starting point.</span> After a few days, NoVape can refine it from what you actually track.</p>
</div>
<div style="flex-grow: 1"></div>
<a href="Onboarding4.dc.html" class="press" style="height: 56px; border-radius: 18px; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { value: 120 };
  renderVals() {
    const v = this.state.value;
    return {
      value: v >= 300 ? '300+' : v,
      pct: Math.round(((v - 10) / 290) * 100),
      dec: () => this.setState({ value: Math.max(10, this.state.value - 5) }),
      inc: () => this.setState({ value: Math.min(300, this.state.value + 5) }),
      onSlide: (e) => this.setState({ value: Number(e.target.value) })
    };
  }
}
</script>
</body>
</html>
