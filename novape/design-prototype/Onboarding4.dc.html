<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NoVape · Connect device</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#111111;text-decoration:none}a:hover{color:#111111}
button{font:inherit}
.press{transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.press:active{transform:scale(.98)}
@keyframes pulse{0%{transform:scale(.55);opacity:.55}100%{transform:scale(1.35);opacity:0}}
.pulse{animation:pulse 2.6s cubic-bezier(.22,1,.36,1) infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.float{animation:float 5s ease-in-out infinite}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
.fade{animation:fadeUp .6s cubic-bezier(.22,1,.36,1) both}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .9s linear infinite;transform-origin:center}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #111111; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; box-sizing: border-box; padding: 52px 24px 40px 24px">
<div style="display: flex; align-items: center; gap: 16px">
<a href="Onboarding3.dc.html" aria-label="Back" style="width: 40px; height: 40px; margin-left: -8px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div aria-label="Step 3 of 4" style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-right: 32px">
<span style="height: 4px; border-radius: 999px; background: #7FBF9A"></span>
<span style="height: 4px; border-radius: 999px; background: #7FBF9A"></span>
<span style="height: 4px; border-radius: 999px; background: #7FBF9A"></span>
<span style="height: 4px; border-radius: 999px; background: #EFEFF0"></span>
</div>
</div>

<div style="margin-top: 20px; height: 330px; position: relative; display: flex; align-items: center; justify-content: center">
<sc-if value="{{searching}}" hint-placeholder-val="{{false}}">
<span class="pulse" style="position: absolute; left: 65px; top: 35px; width: 260px; height: 260px; border-radius: 999px; background: #E3F1E8"></span>
<span class="pulse" style="position: absolute; left: 65px; top: 35px; width: 260px; height: 260px; border-radius: 999px; background: #E3F1E8; animation-delay: 1.3s"></span>
</sc-if>
<span style="position: absolute; left: 95px; top: 65px; width: 200px; height: 200px; border-radius: 999px; background: #F5F9F6"></span>
<svg class="float" width="150" height="270" viewBox="0 0 200 360" aria-label="NoVape One device" role="img" style="position: relative">
<defs>
<linearGradient id="obody" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#DADADF"></stop><stop offset=".22" stop-color="#F6F6F7"></stop><stop offset=".48" stop-color="#FFFFFF"></stop><stop offset=".8" stop-color="#EDEDEF"></stop><stop offset="1" stop-color="#D1D1D6"></stop></linearGradient>
<linearGradient id="ocap" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#A6D4C3"></stop><stop offset=".25" stop-color="#D4EEE4"></stop><stop offset=".5" stop-color="#EAF7F2"></stop><stop offset=".8" stop-color="#C5E6D9"></stop><stop offset="1" stop-color="#9BCBB9"></stop></linearGradient>
<radialGradient id="oshadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#111111" stop-opacity=".18"></stop><stop offset="1" stop-color="#111111" stop-opacity="0"></stop></radialGradient>
<clipPath id="oclip"><rect x="62" y="24" width="76" height="296" rx="38"></rect></clipPath>
</defs>
<ellipse cx="100" cy="342" rx="54" ry="8" fill="url(#oshadow)"></ellipse>
<rect x="62" y="24" width="76" height="296" rx="38" fill="url(#obody)"></rect>
<g clip-path="url(#oclip)">
<rect x="62" y="24" width="76" height="84" fill="url(#ocap)"></rect>
<rect x="62" y="107" width="76" height="1.2" fill="#FFFFFF" opacity=".9"></rect>
<rect x="62" y="108.2" width="76" height="1" fill="#C6C6CC"></rect>
<rect x="75" y="40" width="7" height="262" rx="3.5" fill="#FFFFFF" opacity=".6"></rect>
</g>
<rect x="62.5" y="24.5" width="75" height="295" rx="37.5" fill="none" stroke="#111111" stroke-opacity=".06"></rect>
<circle cx="100" cy="252" r="11" fill="#7FBF9A" opacity="{{glow}}"></circle>
<circle cx="100" cy="252" r="3.4" fill="{{led}}"></circle>
<text x="100" y="296" text-anchor="middle" font-size="7" letter-spacing="2.4" fill="#B9B9BE" font-weight="600">NOVAPE</text>
</svg>
</div>

<div class="fade" style="margin-top: 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.035em">{{title}}</h1>
<p style="margin: 0; font-size: 16px; line-height: 23px; color: #777777; max-width: 310px">{{sub}}</p>
</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{idle}}" hint-placeholder-val="{{true}}">
<button type="button" class="press" onClick="{{connect}}" style="height: 56px; border: 0; border-radius: 18px; background: #111111; color: #FFFFFF; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer">Connect device</button>
</sc-if>
<sc-if value="{{searching}}" hint-placeholder-val="{{false}}">
<button type="button" disabled="" style="height: 56px; border: 0; border-radius: 18px; background: #F4F4F5; color: #777777; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">
<svg class="spin" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#777777" stroke-width="2.2" stroke-linecap="round"><path d="M12 3a9 9 0 1 1-9 9"></path></svg>Searching…</button>
</sc-if>
<sc-if value="{{connected}}" hint-placeholder-val="{{false}}">
<a href="Onboarding5.dc.html" class="press" style="height: 56px; border-radius: 18px; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Continue</a>
</sc-if>
<a href="Onboarding5.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: #777777">Set up later</a>
<p style="margin: 4px 0 0 0; font-size: 12px; line-height: 17px; color: #9A9AA0; text-align: center">NoVape One is nicotine-free and produces no vapor.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { phase: 'idle' };
  componentWillUnmount() { clearTimeout(this.timer); }
  renderVals() {
    const p = this.state.phase;
    const copy = {
      idle: ['Connect your NoVape', 'Hold the button on your NoVape One for 3 seconds, until the light starts to pulse.'],
      searching: ['Looking for your NoVape…', 'Keep your device close to your phone.'],
      connected: ['NoVape One connected', 'Battery 82% · Mint cartridge. Your uses will now sync automatically.']
    };
    return {
      idle: p === 'idle',
      searching: p === 'searching',
      connected: p === 'connected',
      title: copy[p][0],
      sub: copy[p][1],
      led: p === 'idle' ? '#CFCFD4' : '#7FBF9A',
      glow: p === 'idle' ? '0' : '0.22',
      connect: () => {
        this.setState({ phase: 'searching' });
        clearTimeout(this.timer);
        this.timer = setTimeout(() => this.setState({ phase: 'connected' }), 2600);
      }
    };
  }
}
</script>
</body>
</html>
