<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NoVape · What would you like to achieve?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#111111;text-decoration:none}a:hover{color:#111111}
button{font:inherit;color:inherit}
.press{transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .2s ease,background .2s ease}
.press:active{transform:scale(.98)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
.fade{animation:fadeUp .6s cubic-bezier(.22,1,.36,1) both}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #111111; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; box-sizing: border-box; padding: 52px 24px 40px 24px">
<div style="display: flex; align-items: center; gap: 16px">
<a href="Onboarding1.dc.html" aria-label="Back" style="width: 40px; height: 40px; margin-left: -8px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div aria-label="Step 1 of 4" style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-right: 32px">
<span style="height: 4px; border-radius: 999px; background: #7FBF9A"></span>
<span style="height: 4px; border-radius: 999px; background: #EFEFF0"></span>
<span style="height: 4px; border-radius: 999px; background: #EFEFF0"></span>
<span style="height: 4px; border-radius: 999px; background: #EFEFF0"></span>
</div>
</div>
<div class="fade" style="margin-top: 36px; display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.035em">What would you like to achieve?</h1>
<p style="margin: 0; font-size: 16px; line-height: 23px; color: #777777">There’s no wrong answer. You can change this anytime.</p>
</div>
<div role="radiogroup" aria-label="Your intention" style="margin-top: 32px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{options}}" as="o" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{o.checked}}" class="press fade" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 16px; padding: 18px 18px 18px 20px; border-radius: 20px; border: 1.5px solid {{o.border}}; background: {{o.bg}}; text-align: left; cursor: pointer; animation-delay: {{o.delay}}ms">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 17px; font-weight: 600; letter-spacing: -0.015em">{{o.title}}</span>
<span style="font-size: 14px; line-height: 20px; color: #777777">{{o.sub}}</span>
</div>
<sc-if value="{{o.selected}}" hint-placeholder-val="{{false}}">
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#7FBF9A"></circle><path d="M7.5 12.3l3 3 6-6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</sc-if>
<sc-if value="{{o.unselected}}" hint-placeholder-val="{{true}}">
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="none" stroke="#DADADE" stroke-width="1.5"></circle></svg>
</sc-if>
</button>
</sc-for>
</div>
<div style="flex-grow: 1"></div>
<a href="Onboarding3.dc.html" class="press" style="height: 56px; border-radius: 18px; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { picked: 'stop' };
  renderVals() {
    const list = [
      { id: 'stop', title: 'Stop vaping completely', sub: 'Step down gradually until you don’t need it anymore.' },
      { id: 'less', title: 'Vape less', sub: 'Find a level that feels right for you.' },
      { id: 'understand', title: 'Understand my habits', sub: 'Just track for now. Set goals when you’re ready.' }
    ];
    return {
      options: list.map((o, i) => {
        const sel = this.state.picked === o.id;
        return {
          title: o.title,
          sub: o.sub,
          selected: sel,
          unselected: !sel,
          checked: sel ? 'true' : 'false',
          border: sel ? '#7FBF9A' : '#EAEAEA',
          bg: sel ? '#F4FAF6' : '#FFFFFF',
          delay: 120 + i * 60,
          pick: () => this.setState({ picked: o.id })
        };
      })
    };
  }
}
</script>
</body>
</html>
