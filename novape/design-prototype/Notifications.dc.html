<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NoVape · Notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#111111;text-decoration:none}a:hover{color:#111111}
button{font:inherit;color:inherit}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.fade{animation:fadeUp .6s cubic-bezier(.22,1,.36,1) both}
.knob{transition:transform .25s cubic-bezier(.22,1,.36,1)}
.track{transition:background .25s ease}
</style>
</helmet>
<div style="width: 390px; height: 1150px; position: relative; overflow: hidden; background: #FFFFFF; color: #111111; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
<div style="display: flex; flex-direction: column; padding: 52px 24px 0 24px; box-sizing: border-box">
<a href="Profile.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 2px; height: 40px; margin-left: -8px; padding-right: 8px; font-size: 16px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>Profile</a>
<div class="fade" style="margin-top: 8px; display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.035em">Notifications</h1>
<p style="margin: 0; font-size: 15px; line-height: 20px; color: #777777">Informative, never pushy.</p>
</div>

<div class="fade" style="margin-top: 28px; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #777777; animation-delay: 60ms">RECENT</div>
<div style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{recent}}" as="n" hint-placeholder-count="4">
<div class="fade" style="background: #F7F7F8; border-radius: 20px; padding: 14px 16px; display: flex; gap: 12px; animation-delay: {{n.delay}}ms">
<div style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 10px; background: #FFFFFF; border: 1px solid #ECECEE; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="25" fill="none" stroke="#7FBF9A" stroke-width="9" stroke-linecap="round" stroke-dasharray="124 33.1" transform="rotate(-48 36 36)"></circle></svg>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
<div style="display: flex; justify-content: space-between">
<span style="font-size: 13px; font-weight: 600">NoVape</span>
<span style="font-size: 12px; color: #9A9AA0">{{n.time}}</span>
</div>
<span style="font-size: 15px; line-height: 21px; letter-spacing: -0.005em">{{n.text}}</span>
</div>
</div>
</sc-for>
</div>

<div class="fade" style="margin-top: 32px; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #777777; animation-delay: 200ms">WHAT YOU RECEIVE</div>
<section class="fade" style="margin-top: 12px; background: #FFFFFF; border: 1px solid #EFEFF0; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; animation-delay: 200ms">
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 18px; border-top: {{t.border}}">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15.5px">{{t.label}}</span>
<span style="font-size: 13px; color: #9A9AA0">{{t.sub}}</span>
</div>
<button type="button" role="switch" aria-checked="{{t.checked}}" aria-label="{{t.label}}" onClick="{{t.toggle}}" class="track" style="width: 51px; height: 31px; flex-shrink: 0; border: 0; border-radius: 999px; background: {{t.bg}}; position: relative; cursor: pointer; padding: 0">
<span class="knob" style="position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(17,17,17,0.18); transform: translateX({{t.x}}px)"></span>
</button>
</div>
</sc-for>
<a href="#quiet" style="display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 18px; border-top: 1px solid #F4F4F5">
<span style="flex-grow: 1; font-size: 15.5px">Quiet hours</span>
<span style="font-size: 14px; color: #9A9AA0">22:00 – 08:00</span>
<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#B5B5BA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</section>
<div class="fade" style="margin-top: 16px; background: #EEF6F1; border-radius: 18px; padding: 16px 18px; display: flex; gap: 12px; animation-delay: 240ms">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#4E8F6A" stroke-width="1.7" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><path d="M12 3.5l7 3v5c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9v-5z"></path></svg>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #3F5A49"><span style="color: #111111; font-weight: 600">Our promise:</span> no streak pressure, no countdowns, and never a nudge to use your device more.</p>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1150}}'>
class Component extends DCLogic {
  state = { on: { progress: true, patterns: true, milestones: true, summary: false } };
  renderVals() {
    const recent = [
      { time: 'now', text: 'You’re currently 18% below your usual usage today.' },
      { time: '15:52', text: 'You normally have more cravings around this time.' },
      { time: 'Yesterday', text: 'Yesterday was your lowest-use day yet.' },
      { time: 'Sep 14', text: '7 days of progress.' }
    ].map((n, i) => ({ time: n.time, text: n.text, delay: 80 + i * 50 }));
    const defs = [
      { id: 'progress', label: 'Progress updates', sub: 'How today compares to usual' },
      { id: 'patterns', label: 'Pattern reminders', sub: 'Before your usual craving times' },
      { id: 'milestones', label: 'Milestones', sub: 'Quiet notes when you reach one' },
      { id: 'summary', label: 'Daily summary', sub: 'Each evening at 21:00' }
    ];
    const on = this.state.on;
    return {
      recent: recent,
      toggles: defs.map((d, i) => ({
        label: d.label,
        sub: d.sub,
        border: i === 0 ? '0' : '1px solid #F4F4F5',
        checked: on[d.id] ? 'true' : 'false',
        bg: on[d.id] ? '#7FBF9A' : '#E4E4E7',
        x: on[d.id] ? 20 : 0,
        toggle: () => {
          const next = Object.assign({}, this.state.on);
          next[d.id] = !next[d.id];
          this.setState({ on: next });
        }
      }))
    };
  }
}
</script>
</body>
</html>
